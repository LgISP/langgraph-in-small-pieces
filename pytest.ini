# Markers for the book's answer files. Declaring them here is what makes
# `pytest -m slow` select rather than silently match nothing, and what lets
# `--strict-markers` turn a typo'd marker into an error instead of a skip.
#
# See code/answers/ch18_real_model_test.py (Ch18 Gold) for the one test that
# carries `slow`: it needs the local model server, and it is the only assertion
# in the book that can go red on a day nothing in the repository changed.
[pytest]
# The default run is the fast one. `-m slow` on the command line overrides this,
# which is the whole point: the slow test is available on request and never in
# anybody's way.
addopts = -m "not slow"
markers =
    slow: needs the local model server (LM Studio at :1234)
